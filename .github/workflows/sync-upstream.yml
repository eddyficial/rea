name: Sync fork with upstream

# Keeps this fork's main branch current with morluto/rea using GitHub's own
# "Sync fork" mechanism (the merge-upstream API). Fast-forwards when possible,
# otherwise creates a merge commit; it never force-pushes and fails loudly on
# conflicts so nothing is overwritten.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main | tee result.json
          echo "## Sync result" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.message' result.json >> "$GITHUB_STEP_SUMMARY"
